<body>
<main id="primer-viewer">
  <header class="ps-top">
    <div class="ps-brand"><img class="ps-logo" src="./assets/nucleye-eye.svg" width="88" height="55" alt=""><div><h1 class="ps-wordmark" style="margin:0">Nucl<span>Eye</span><small class="ps-version">v0.0.0</small></h1><div class="ps-sub">Suivi des primers & sondes</div></div></div>
  </header>
  <div class="ps-body">
    <div class="ps-filters">
      <label>Virus<select id="ps-virus" aria-label="Virus"></select><span id="ps-virus-updated" class="ps-sub" aria-live="polite"></span></label>
      <div class="ps-filter"><label for="ps-assay">Set de primers</label><select id="ps-assay" aria-label="Set de primers" disabled></select><a id="ps-assay-reference" class="ps-reference" target="_blank" rel="noopener noreferrer" hidden>Référence ↗</a></div>
      <div class="ps-filter"><span id="ps-country-label">Pays</span><details id="ps-country" class="ps-multi"><summary aria-labelledby="ps-country-label ps-country-selection"><span id="ps-country-selection">Tous les pays</span></summary><div class="ps-filter-menu"><button type="button" id="ps-country-reset" data-filter-reset="country" aria-pressed="true" disabled>Tous les pays</button><div id="ps-country-options" class="ps-filter-options" role="group" aria-label="Pays à inclure"></div></div></details></div>
      <div class="ps-filter"><span id="ps-year-label">Années</span><details id="ps-year" class="ps-multi"><summary aria-labelledby="ps-year-label ps-year-selection"><span id="ps-year-selection">Toutes les années</span></summary><div class="ps-filter-menu"><button type="button" id="ps-year-reset" data-filter-reset="year" aria-pressed="true" disabled>Toutes les années</button><div id="ps-year-options" class="ps-filter-options" role="group" aria-label="Années à inclure"></div></div></details></div>
      <label>Représentants<select id="ps-dedup"><option value="all">Toutes les séquences</option><option value="unique">Unique</option><option value="country">Unique (pays)</option><option value="month">Unique (mois)</option><option value="month-country" selected>Unique (mois, pays)</option></select></label>
    </div>
    <div id="ps-loading" class="ps-loading" role="status">Chargement…</div>
    <div id="ps-error" class="ps-error" role="alert" hidden></div>
    <div id="ps-results" class="ps-sections" hidden>
      <div class="ps-metrics" aria-live="polite">
        <div class="ps-metric"><span>Représentants retenus</span><strong id="ps-count" class="ps-value"></strong><span id="ps-count-caption" class="ps-sub"></span></div>
      </div>
      <section class="ps-panel">
        <div class="ps-head"><h2 style="font-size:16px">Mismatches par position</h2><div class="ps-tabs" aria-label="Oligos affichés"><button type="button" data-oligo="all" aria-pressed="true">Les 3</button><button type="button" data-oligo="F" aria-pressed="false">Forward</button><button type="button" data-oligo="P" aria-pressed="false">Sonde</button><button type="button" data-oligo="R" aria-pressed="false">Reverse</button></div></div>
        <div id="ps-oligo-panels" class="ps-oligo-panels"></div>
        <div class="ps-legend"><span><i class="ps-dot mm"></i>Substitution</span></div>
      </section>
      <section class="ps-panel">
        <div class="ps-head"><h2 style="font-size:16px">Séquences & alignements</h2><label class="ps-table-filter"><input id="ps-only-mm" type="checkbox"><span id="ps-only-mm-label">Avec mismatch sur l’oligo affiché</span></label></div>
        <div class="ps-scroll"><table><thead><tr id="ps-table-head"></tr></thead><tbody id="ps-rows"></tbody></table></div>
        <div class="ps-bottom"><span id="ps-table-status" aria-live="polite"></span><div class="ps-pages"><button id="ps-prev" type="button" aria-label="Page précédente">←</button><span id="ps-page"></span><button id="ps-next" type="button" aria-label="Page suivante">→</button></div></div>
        <div id="ps-detail" class="ps-detail" hidden></div>
      </section>
    </div>
  </div>
  <footer class="ps-copyright">© 2026 Florian LAUBSCHER</footer>
  <div id="ps-tooltip" class="ps-tooltip" role="tooltip" hidden></div>
  <noscript>Active JavaScript pour afficher les données.</noscript>
</main>
<script>
(() => {
  'use strict';
  const root = document.getElementById('primer-viewer');
  const $ = id => root.querySelector('#' + id);
  const roles = ['F', 'P', 'R'];
  const names = {F: 'Forward', P: 'Sonde', R: 'Reverse'};
  const canonical = ['A', 'T', 'G', 'C'];
  const nucleotideColors = {A:'#369957', T:'#d74747', G:'#ffb000', C:'#357fca'};
  const iupac = {A:'A', C:'C', G:'G', T:'T', R:'AG', Y:'CT', S:'CG', W:'AT', K:'GT', M:'AC', B:'CGT', D:'AGT', H:'ACT', V:'ACG', N:'ACGT'};
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = (n, d) => d ? (100*n/d).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' %' : '—';
  const compatible = (base, primer) => canonical.includes(base) && iupac[primer].includes(base);
  let sets = [], viruses = [], rows = [], current = [], visible = [], positionStats = {};
  const pageSize = 10;
  let selectedOligo = 'all', positions = {F:0,P:0,R:0}, page = 0, loadVersion = 0;
  const expandedPositions = new Set();
  const shownRoles = () => selectedOligo === 'all' ? roles : [selectedOligo];
  const dataCache = new Map();
  let currentReference = null;
  const multiFilters = {
    country:{selected:new Set(),options:[],all:'Tous les pays',plural:'pays'},
    year:{selected:new Set(),options:[],all:'Toutes les années',plural:'années'}
  };
  const state = () => ({a:$('ps-assay').value, c:[...multiFilters.country.selected], y:[...multiFilters.year.selected], d:$('ps-dedup').value});
  const activeSet = () => sets.find(s => s.id === state().a);
  const refFor = role => activeSet().oligos[role].sequence;
  const target = (row, role) => row.targets[state().a]?.[role] ?? 'N'.repeat(refFor(role).length);
  const complete = row => roles.every(role => /^[ACGT]+$/.test(target(row, role)));
  const mm = (seq, ref) => [...seq].reduce((n,b,i) => n + (canonical.includes(b) && !compatible(b, ref[i]) ? 1 : 0), 0);

        const uncertain = row.targetStatus[role].some(s => !['base','deletion'].includes(s));
        const bases = `<div class="ps-seq" aria-label="${names[role]} : ${seq}">${[...seq].map((b,i) => {
          const status = row.targetStatus[role][i], mismatch = status === 'base' && !compatible(b,ref[i]);
          const cls = mismatch ? 'mm' : status === 'deletion' ? 'del' : status === 'base' ? '' : 'nn';
          const displayed = status === 'uncovered' ? '·' : status === 'unavailable' ? '?' : b;
          return `<span class="${cls}" data-site="${i}" data-role="${role}"${mismatch || status === 'deletion' ? ` tabindex="0" aria-label="${esc(distributionText(role,i))}"` : ''}>${displayed}</span>`;
        }).join('')}</div>`;
        return `<td>${bases}${allShown ? `<div class="ps-mm-count">${mismatches} MM${deletions ? ` · ${deletions} dél.` : ''}${uncertain ? ' + ?' : ''}</div>` : ''}</td>`;
      }).join('');
      const singleCount = allShown ? '' : `<td class="ps-right">${mm(target(row,selectedOligo),refFor(selectedOligo))}${/[^ACGT]/.test(target(row,selectedOligo))?' + ?':''}</td>`;
      return `<tr><td>${identifierLink(row.id)}</td><td>${esc(meta.countryText)}<div class="ps-sub">${esc(meta.periodText)}</div></td>${alignmentCells}${singleCount}<td class="ps-right"><button class="ps-id" type="button" data-row="${esc(row.id)}" title="Afficher les détails et les membres du groupe" aria-label="Afficher les détails de ${esc(row.id)} et ses ${row.members.length} séquences représentées">${row.members.length}</button></td></tr>`;
    }).join('') || `<tr><td colspan="${allShown ? 6 : 5}">Aucune séquence pour ces filtres.</td></tr>`;
    $('ps-table-status').textContent = `${visible.length} ${d === 'all' ? 'séquences' : 'représentants'}`;
    $('ps-page').textContent = `${page+1} / ${pages}`;
    $('ps-prev').disabled = page===0; $('ps-next').disabled = page===pages-1;
    $('ps-detail').hidden = true;
    $('ps-tooltip').hidden = true;
  }
  function detail(id) {
    const row = current.find(r => r.id === id); if (!row) return;
    const profiles = new Map();
    for (const m of row.members) { const key = signature(m); if (!profiles.has(key)) profiles.set(key,{row:m,n:0}); profiles.get(key).n++; }
    const date = row.collectionDate, loc = row.location, meta = groupMetadata(row);
    $('ps-detail').innerHTML = `<div class="ps-head"><strong>${identifierLink(row.id)}</strong><button type="button" id="ps-close">Fermer</button></div><dl><dt>Date du représentant</dt><dd>${esc(date.raw || 'Non renseignée')} · ${precisionNames[date.precision]}</dd><dt>Lieu du représentant</dt><dd>${esc(loc.raw || [loc.country,loc.region,loc.locality].filter(Boolean).join(' / ') || 'Non renseigné')}</dd>${row.insertionRoles.length ? `<dt>Zone non évaluable</dt><dd>Insertion dans la cible : ${row.insertionRoles.join(', ')}</dd>` : ''}<dt>Profil</dt><dd class="ps-inline-profile">${profileLabel(row)}</dd><dt>Profils du groupe</dt><dd>${[...profiles.values()].sort((a,b) => b.n-a.n).map(p => `<div><span class="ps-inline-profile">${profileLabel(p.row)}</span> — ${p.n}/${row.members.length} (${pct(p.n,row.members.length)})${complete(p.row)?'':' · incomplet'}</div>`).join('')}</dd><dt>Pays du groupe</dt><dd>${esc(meta.countries.join(', '))}</dd><dt>Périodes du groupe</dt><dd>${esc(meta.periods.join(', '))}</dd><dt>Séquences représentées</dt><dd>${row.members.length}</dd><dt>Membres</dt><dd>${row.members.map(m => identifierLink(m.id)).join(', ')}</dd></dl>`;
    $('ps-detail').hidden = false;
  }
  function moveTooltip(event, cell) {
    const tip = $('ps-tooltip'), rect = cell.getBoundingClientRect();
    const x = Number.isFinite(event.clientX) ? event.clientX : rect.left + rect.width/2;
    const y = Number.isFinite(event.clientY) ? event.clientY : rect.bottom;
    const box = tip.getBoundingClientRect();
    tip.style.left = Math.max(8,Math.min(x+12,innerWidth-box.width-8))+'px';
    tip.style.top = Math.max(8,Math.min(y+16,innerHeight-box.height-8))+'px';
  }
  function inspect(event) {
    const cell = event.target.closest('[data-site]'); if (!cell || !root.contains(cell)) return;
    const index = Number(cell.dataset.site), role = cell.dataset.role;
    const tip = $('ps-tooltip'); tip.innerHTML = distributionHTML(role,index); tip.hidden = false;
    cell.setAttribute('aria-describedby','ps-tooltip');
    moveTooltip(event,cell);
  }
  root.addEventListener('change',event => {
    if (event.target.id === 'ps-virus') { loadVirus(); return; }
    if (event.target.id === 'ps-assay') { loadSet(); return; }
    if (!$('ps-loading').hidden) return;
    const key = event.target.dataset.filter;
    if (key && multiFilters[key]) {
      const selected = multiFilters[key].selected;
      if (event.target.checked) selected.add(event.target.value); else selected.delete(event.target.value);
      syncFilter(key);
    }
    page=0;
    if(rows && activeSet()) draw();
  });
  root.addEventListener('pointerover',inspect);
  root.addEventListener('focusin',inspect);
  root.addEventListener('pointermove',event => {const cell=event.target.closest('[data-site]');if(cell&&!$('ps-tooltip').hidden)moveTooltip(event,cell)});
  root.addEventListener('pointerout',event => {const cell=event.target.closest('[data-site]');if(cell&&!cell.contains(event.relatedTarget)){$('ps-tooltip').hidden=true;cell.removeAttribute('aria-describedby')}});
  root.addEventListener('focusout',event => {$('ps-tooltip').hidden=true;event.target.removeAttribute('aria-describedby')});
  root.addEventListener('keydown',event => {
    if(event.key !== 'Escape') return;
    $('ps-tooltip').hidden = true;
    for (const key of Object.keys(multiFilters)) {
      const menu = $('ps-'+key);
      if (menu.open) { menu.open = false; menu.querySelector('summary').focus(); }
    }
  });
  root.addEventListener('click',event => {
    const cell=event.target.closest('[data-site]');if(cell)showPosition(cell.dataset.role,Number(cell.dataset.site));
    const b=event.target.closest('button');if(!b||!root.contains(b))return;
    if(b.dataset.filterReset){
      if (!$('ps-loading').hidden) return;
      const key = b.dataset.filterReset;
      multiFilters[key].selected.clear();
      $('ps-'+key+'-options').querySelectorAll('input').forEach(input => {input.checked=false});
      syncFilter(key); page=0;
      if(activeSet()) draw();
    }
    else if(b.dataset.oligo){selectedOligo=b.dataset.oligo;positions={F:0,P:0,R:0};expandedPositions.clear();page=0;draw()}
    else if(b.dataset.closePosition){expandedPositions.delete(b.dataset.closePosition);showPosition(b.dataset.closePosition,positions[b.dataset.closePosition],false)}
    else if(b.dataset.position!==undefined)showPosition(b.dataset.role,Number(b.dataset.position));
    else if(b.dataset.row)detail(b.dataset.row);
    else if(b.id==='ps-prev'){page--;draw()}
    else if(b.id==='ps-next'){page++;draw()}
    else if(b.id==='ps-close')$('ps-detail').hidden=true;
  });
  document.addEventListener('click',event => {
    for (const key of Object.keys(multiFilters)) {
      const menu = $('ps-'+key);
      if (!menu.contains(event.target)) menu.open = false;
    }
  });
  window.addEventListener('scroll',() => {$('ps-tooltip').hidden=true},{passive:true});
  async function init() {
    try {
      viruses=validateCatalog(await readJSON('viruses.json'));
      $('ps-virus').innerHTML=viruses.map(v=>option(v.id,v.name)).join('');
      await loadVirus();
    } catch(error){$('ps-loading').hidden=true;showError(error)}
  }
  init();
})();

</script>
</body>
</html>
